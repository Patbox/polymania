import java.nio.file.Files
import java.nio.file.Paths

plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = Files.readString(file("../version.txt").toPath())
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven {url = 'https://maven.nucleoid.xyz' }
	maven {url = 'https://api.modrinth.com/maven' }
	maven { url 'https://maven.kneelawk.com/releases/' }
}


dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	modImplementation "eu.pb4:placeholder-api:2.8.2+1.21.10"
	modImplementation "eu.pb4:polymer-core:0.15.2+1.21.11"
	modImplementation "eu.pb4:polymer-blocks:0.15.2+1.21.11"
	modImplementation "eu.pb4:polymer-resource-pack:0.15.2+1.21.11"
	modImplementation "eu.pb4:polymer-resource-pack-extras:0.15.2+1.21.11"
	modImplementation "eu.pb4:polymer-virtual-entity:0.15.2+1.21.11"
	modImplementation "eu.pb4:polymer-autohost:0.15.2+1.21.11"

	modImplementation 'eu.pb4:booklet:0.1.0+1.21.11'
	modImplementation 'eu.pb4:map-canvas-api:0.7.1+1.21.11'
	modImplementation 'eu.pb4:common-protection-api:1.0.0'
	modImplementation 'eu.pb4:sidebar-api:0.5.1+1.21.1'
	modImplementation 'eu.pb4:sgui:1.12.0+1.21.11'
	modImplementation 'eu.pb4:factorytools:0.9.5+1.21.11'
	modImplementation 'xyz.nucleoid:server-translations-api:2.5.2+1.21.9-pre3'
	//modImplementation include('com.kneelawk.graphlib:graphlib-core-fabric:2.0.3-beta.1+1.21.5')
	//modImplementation 'com.kneelawk.graphlib:graphlib-core-fabric:2.0.3-beta.0.patbox+1.21.11'
	//modImplementation 'maven.modrinth:polyfactory:0.10.3+1.21.11'

}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}